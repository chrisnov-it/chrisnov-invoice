<!DOCTYPE html>
<html lang="{{ current_locale }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to {{ config['BUSINESS_NAME'] }} — manage your invoices, clients, and payments.">
    <title>{% block title %}{{ config['BUSINESS_NAME'] }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
</head>

<body class="min-h-screen bg-gray-50">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-lg bg-primary text-white">
                    <i class="fas fa-file-invoice text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">{{ config['BUSINESS_NAME'] }}</h1>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-6 space-y-3">
                {% for category, message in messages %}
                <div class="rounded-lg px-4 py-3 text-sm {% if category == 'success' %}bg-green-100 text-green-800 border border-green-300{% elif category == 'error' %}bg-red-100 text-red-800 border border-red-300{% else %}bg-blue-100 text-blue-800 border border-blue-300{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <div class="rounded-lg bg-white p-8 shadow-md">
                {% block content %}{% endblock %}
            </div>

            <p class="mt-4 text-center text-xs text-gray-500">v{{ config['APP_VERSION'] }}</p>
        </div>
    </main>
</body>

</html>

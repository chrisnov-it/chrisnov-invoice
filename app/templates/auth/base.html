<!DOCTYPE html>
<html lang="{{ current_locale }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to {{ config['BUSINESS_NAME'] }} — manage your invoices, clients, and payments.">
    <title>{% block title %}{{ config['BUSINESS_NAME'] }}{% endblock %}</title>
    <script>
        // FOUC prevention: apply dark class before paint (syncs with base.html)
        (function() {
            try {
                if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
</head>

<body class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <!-- Theme toggle (fixed, matches base.html behavior) -->
    <button id="theme-toggle" onclick="toggleTheme()" class="fixed top-4 right-4 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition duration-200" aria-label="Toggle theme">
        <i class="fas fa-moon text-gray-600 dark:text-gray-300"></i>
    </button>

    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-lg bg-primary text-white">
                    <i class="fas fa-file-invoice text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ config['BUSINESS_NAME'] }}</h1>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-6 space-y-3">
                {% for category, message in messages %}
                <div class="rounded-lg px-4 py-3 text-sm {% if category == 'success' %}bg-green-100 text-green-800 border border-green-300 dark:bg-green-900 dark:text-green-100 dark:border-green-800{% elif category == 'error' %}bg-red-100 text-red-800 border border-red-300 dark:bg-red-900 dark:text-red-100 dark:border-red-800{% else %}bg-blue-100 text-blue-800 border border-blue-300 dark:bg-blue-900 dark:text-blue-100 dark:border-blue-800{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <div class="rounded-lg bg-white dark:bg-gray-800 p-8 shadow-md dark:shadow-gray-900/20 dark:border dark:border-gray-700">
                {% block content %}{% endblock %}
            </div>

            <p class="mt-4 text-center text-xs text-gray-500 dark:text-gray-400">v{{ config['APP_VERSION'] }}</p>
        </div>
    </main>

    <script>
        // Sync icon on load
        document.addEventListener('DOMContentLoaded', function() {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var icon = btn.querySelector('i');
            if (document.documentElement.classList.contains('dark')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });
        function toggleTheme() {
            var isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var icon = btn.querySelector('i');
            if (isDark) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }
    </script>
</body>

</html>
